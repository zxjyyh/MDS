# 内业管理系统 — 本地构建部署
#
# 用法（【无需 .env 文件】，所有配置见下方 environment 默认值）：
#   1. mkdir -p data uploads logs
#   2. docker compose up -d --build
#
# 在 NAS 上部署请优先使用 docker-compose.nas.yml：
# 它直接拉取云端已构建好的镜像，不需要在 NAS 上跑 npm ci + vite build + go build
# （这套构建峰值内存约 2GB，低配 NAS 极易 OOM，表现为构建卡死或容器被杀）。

services:
  mds:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 国内网络可解开下面两行加速构建
        # GOPROXY: https://goproxy.cn,direct
        # NPM_REGISTRY: https://registry.npmmirror.com
        APP_VERSION: ${APP_VERSION:-local}
    image: ${IMAGE_NAME:-mds:local}
    container_name: ${CONTAINER_NAME:-mds}

    ports:
      # 宿主机端口可用 HOST_PORT 覆盖，避免和 NAS 上其它服务撞port
      - "${HOST_PORT:-13000}:3000"

    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs

    environment:
      # 时区必须设置：定时提醒按本地时间 08:30 触发，
      # 不设置的话容器是 UTC，实际会在北京时间 16:30 才发提醒。
      TZ: ${TZ:-Asia/Shanghai}
      # 以宿主机用户身份写文件。1000 是多数 Linux 默认用户；
      # 在 NAS 上若遇到 permission denied，把它改成 0:0（root）即可，
      # 或改用 docker-compose.nas.yml（默认就是 0:0）。
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # 可选：显式固定 JWT 密钥。留空则自动生成并持久化到 data/.secrets.env。
      # JWT_SECRET: ${JWT_SECRET:-}
      # JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      # 可选：SMTP 邮件（也可在系统页面里配）。留空不发送提醒邮件。
      # SMTP_HOST: ${SMTP_HOST:-}
      # SMTP_PORT: ${SMTP_PORT:-465}
      # SMTP_USER: ${SMTP_USER:-}
      # SMTP_PASS: ${SMTP_PASS:-}
      # SMTP_FROM: ${SMTP_FROM:-}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
