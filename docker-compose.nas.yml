# 内业管理系统 — NAS 部署（拉取云端已构建镜像）
#
# 适用于绿联 UGOS Pro / 飞牛 fnOS / 群晖等 NAS。
# 镜像由 GitHub Actions 在云端构建后推送到 GHCR，NAS 只负责拉取运行，
# 不在本地跑 npm ci / vite build / go build（低配 NAS 跑这套构建极易 OOM）。
#
# 【无需 .env 文件】所有配置都在下方 environment 中以默认值给出，
# 直接 docker compose up -d 即可；如需覆盖，改这里的默认值或赋环境变量都行。
#
# 部署步骤：
#   1. 在 NAS 上创建目录，例如 /volume1/docker/mds，并进入
#   2. mkdir -p data uploads logs backups
#   3. 把本文件放进去（docker-compose.nas.yml）即可，不需要再建 .env
#   4. docker compose -f docker-compose.nas.yml pull
#      docker compose -f docker-compose.nas.yml up -d
#   5. 浏览器访问 http://<NAS内网IP>:13000
#
# 【仓库转私有后必读】镜像仓库为 Private 时，NAS 必须先登录才有权拉取：
#   1. 生成 GitHub PAT（classic）：Settings → Developer settings →
#      Personal access tokens → Tokens (classic)
#      勾选 read:packages（必需）+ repo（镜像属私有仓库，建议一并勾选），并设置有效期
#   2. SSH 登录 NAS 执行（先 logout 清掉可能残留的旧凭据）：
#        docker logout ghcr.io
#        echo <PAT> | docker login ghcr.io -u <GitHub用户名> --password-stdin
#      看到 "Login Succeeded" 即成功。凭据保存在 NAS 的 ~/.docker/config.json，
#      之后 docker compose pull 无需重复登录；PAT 到期后需重做一次本步骤
#   3. 说明：绿联 UGOS Pro 的「镜像 → 镜像仓库 → 新建」只能填「别名 + 源链接」
#      （那是**镜像加速源**，没有账号密码字段）→ 图形界面无法登录 GHCR 私有仓库。
#      若想完全不用 SSH，两条替代路线：
#        a) 在 NAS 上装 Portainer（应用中心可能有），在它的 Registries 里添加
#           ghcr.io + 用户名 + PAT，再用 Portainer 的 Stack 功能部署本文件；
#        b) 本机构建后「导出 tar → 图形界面 本地镜像 → 导入」：
#             docker build -f backend/Dockerfile -t mds:local --platform linux/amd64 .
#             docker save mds:local -o mds.tar
#           传到 NAS 后在 Docker 图形界面导入，并把上面 image: 改成 mds:local
#           （每次更新都要手动搬一次文件）
#
# 关于 PUID / PGID（容器内运行身份）：
#   默认 0:0（即 root），这样无论 NAS 宿主目录属主是谁、是否支持 chown，
#   容器都能正常读写挂载进来的 data/ uploads/ logs/，避免常见的
#   "permission denied + SQLite out of memory (14)" 启动死循环。
#   若你的 NAS 用户就是 1000，且想用非 root 运行，把它们改成 1000:1000 即可；
#   改完务必保证宿主 data/uploads/logs 目录对该 uid 可写（chmod -R 777 最省事）。

services:
  mds:
    image: ${IMAGE_NAME:-ghcr.io/zxjyyh/mds:latest}
    container_name: ${CONTAINER_NAME:-mds}
    pull_policy: always

    ports:
      - "${HOST_PORT:-13000}:3000"

    volumes:
      # 相对路径（相对于本 compose 文件所在目录）。
      # 想用绝对路径就改成例如 /volume1/docker/mds/data:/app/data
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      # 数据备份输出目录，见容器内「系统管理 → 数据备份」。
      # 务必挂出来，否则容器重建时已生成的备份会随镜像层一起丢失。
      - ./backups:/app/backups

    environment:
      # 时区（容器日志、提醒定时任务都依赖它）
      TZ: ${TZ:-Asia/Shanghai}
      # 容器内运行身份。默认 0:0 = root，规避 NAS bind mount 权限坑。
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      # 可选：显式固定 JWT 密钥（重启不掉登录态且密钥可审计）。
      # 留空时应用会自动生成并持久化到 data/.secrets.env（需目录可写）。
      # JWT_SECRET: ${JWT_SECRET:-}
      # JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
